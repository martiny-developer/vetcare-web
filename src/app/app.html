@if (auth.autenticado()) {
  <nav class="navbar navbar-dark vc-navbar">
    <div class="container d-flex flex-wrap align-items-center gap-2">
      <a class="navbar-brand d-flex align-items-center gap-2 me-3" routerLink="/">
        <span class="fs-4">🩺</span>
        VetCare
      </a>

      <div class="navbar-nav flex-row flex-wrap me-auto">
        <a
          class="nav-link"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="bi bi-house-door me-1"></i>Inicio
        </a>
        <a class="nav-link" routerLink="/duenos" routerLinkActive="active">
          <i class="bi bi-people me-1"></i>Dueños
        </a>
        <a class="nav-link" routerLink="/mascotas" routerLinkActive="active">
          <span class="me-1">🐶</span>Mascotas
        </a>
        <a class="nav-link" routerLink="/citas" routerLinkActive="active">
          <i class="bi bi-calendar-check me-1"></i>Citas
        </a>
      </div>

      <div class="vc-user d-flex align-items-center gap-2">
        <i class="bi bi-person-circle fs-5"></i>
        <span class="fw-semibold">{{ auth.username() }}</span>
        <span class="badge rounded-pill text-bg-light">{{ auth.rol() }}</span>
        <button type="button" class="btn btn-sm btn-light ms-2" (click)="cerrarSesion()">
          <i class="bi bi-box-arrow-right me-1"></i>Salir
        </button>
      </div>
    </div>
  </nav>
}

<main>
  <router-outlet />
</main>
